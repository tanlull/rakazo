# Runs the app from a checkout built on this host instead of a published image, so a deploy is a
# build and a restart with nothing to publish or pull. Layer it over docker-compose.images.yml;
# deploy-source.sh builds each release and points RAKAZO_SOURCE_DIR at the one to run.
x-node-image: &node-image node:24.22.2-bookworm@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40

services:
  supervisor:
    image: *node-image
    working_dir: /app/infra/sandboxes/supervisor
    command: ["node_modules/.bin/tsx", "src/index.ts"]
    volumes:
      - ${RAKAZO_SOURCE_DIR:?Set RAKAZO_SOURCE_DIR}:/app:ro

  migrate:
    image: *node-image
    user: "1000:1000"
    command: ["node", "--enable-source-maps", "dist/cli/migrate-database.js"]
    environment:
      PATH: /app/.tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${RAKAZO_SOURCE_DIR:?Set RAKAZO_SOURCE_DIR}:/app:ro

  api:
    image: *node-image
    user: "1000:1000"
    environment:
      GIT_SHA: ${RAKAZO_SOURCE_REVISION:-}
    volumes:
      - ${RAKAZO_SOURCE_DIR:?Set RAKAZO_SOURCE_DIR}:/app:ro

  worker:
    image: *node-image
    user: "1000:1000"
    environment:
      GIT_SHA: ${RAKAZO_SOURCE_REVISION:-}
    volumes:
      - ${RAKAZO_SOURCE_DIR:?Set RAKAZO_SOURCE_DIR}:/app:ro

  web:
    image: *node-image
    user: "1000:1000"
    environment:
      GIT_SHA: ${RAKAZO_SOURCE_REVISION:-}
    # Writable: vite preview bundles its config into node_modules/.vite-temp.
    volumes:
      - ${RAKAZO_SOURCE_DIR:?Set RAKAZO_SOURCE_DIR}:/app
